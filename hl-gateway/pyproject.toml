[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-gateway"
version = "0.1.0"
description = "Hyperliquid connectivity gateway for Taktgeber"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.31,<1",
  "hyperliquid-python-sdk>=0.22.0,<1",
  "websockets>=12,<16",
  "redis>=5,<6",
  "structlog>=24,<26",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
